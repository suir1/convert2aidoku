[project]
name = "convert2aidoku"
version = "0.1.0"
description = "AI-assisted Tachi/Mihon to Aidoku source converter"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "convert2aidoku contributors" }]
dependencies = [
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "pillow>=11.3.0,<13",
  "platformdirs>=4.3.8,<5",
  "pydantic>=2.11.7,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=14.0.0,<15",
  "tomli-w>=1.2.0,<2",
  "tree-sitter>=0.24.0,<1",
  "tree-sitter-language-pack>=0.9.0,<1",
  "typer>=0.16.0,<1",
  "uvicorn>=0.35.0,<1",
]

[project.scripts]
c2a = "convert2aidoku.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<8",
  "respx>=0.22.0,<1",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convert2aidoku"]

[tool.hatch.build]
include = [
  "src/convert2aidoku/**/*.py",
  "src/convert2aidoku/resources/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: tests requiring the external Rust/Aidoku toolchain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
